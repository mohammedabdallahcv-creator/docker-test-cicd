version: '3.9'
services:
  builder:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
    - '22:22'
    - 3306:3306
    - 5432:5432
    restart: unless-stopped
    networks: &id001
    - app-net
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:22/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
    env_file:
    - .env
    user: 1000:1000
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    depends_on:
    - postgres
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
    - 5432:5432
    volumes:
    - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-appdb}
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: *id001
    env_file:
    - .env
networks:
  app-net: {}
volumes:
  pgdata: {}
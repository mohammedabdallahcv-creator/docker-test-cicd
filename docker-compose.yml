version: '3.9'
services:
  web:
    image: nginx:latest
    container_name: sample_web
    ports:
    - 8080:80
    environment:
      NGINX_HOST: localhost
      NGINX_PORT: 80
    volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
    - api
    - db
    restart: unless-stopped
    user: 1000:1000
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test:
      - CMD-SHELL
      - exit 0
      interval: 30s
      timeout: 10s
      retries: 3
  api:
    image: python:3.11-slim
    container_name: sample_api
    working_dir: /app
    command: sh -c "python -m http.server 5000"
    ports:
    - 5000:5000
    environment:
      APP_ENV: development
      DEBUG: 'true'
      SECRET_KEY: ${SECRET_KEY}
    volumes:
    - ./app:/app
    restart: on-failure
    user: 1000:1000
    env_file:
    - .env
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:15
    container_name: sample_db
    environment:
      POSTGRES_DB: shieldops
      POSTGRES_USER: shieldops_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
    - 5432:5432
    volumes:
    - db_data:/var/lib/postgresql/data
    restart: always
    env_file:
    - .env
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-postgres}
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7
    container_name: sample_redis
    ports:
    - 6379:6379
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  db_data: null
